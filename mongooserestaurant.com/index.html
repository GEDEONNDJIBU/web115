<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mongoose Restaurant | Gedeon Ndjibu</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #e8e8e8;
            font-family: Arial, Helvetica, sans-serif;
        }

        .business-card {
            width: 650px;
            max-width: 90vw;
            background-color: white;
            border: 1px solid #cccccc;
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }

        .top-section {
            padding: 35px 50px 20px;
        }

        .name {
            margin: 0;
            color: #b51f24;
            font-size: 30px;
            font-weight: bold;
        }

        .title {
            margin: 5px 0;
            font-size: 22px;
        }

        .email {
            margin: 5px 0;
            color: #555555;
        }

        .restaurant-name {
            background-color: #c82327;
            color: white;
            text-align: right;
            padding: 12px 35px;
            font-size: 27px;
            font-weight: bold;
        }

        .tagline {
            text-align: right;
            padding: 10px 35px 0;
            font-size: 18px;
        }

        .bottom-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            padding: 20px 50px 35px;
            color: #555555;
        }

        .address,
        .contact {
            line-height: 1.4;
        }

        a {
            color: #555555;
            text-decoration: none;
        }

        a:hover {
            color: #b51f24;
        }

        @media (max-width: 550px) {
            .business-card {
                width: 92vw;
            }

            .top-section {
                padding: 25px;
            }

            .name {
                font-size: 24px;
            }

            .restaurant-name {
                font-size: 21px;
                padding: 10px 25px;
            }

            .tagline {
                padding-right: 25px;
                font-size: 15px;
            }

            .bottom-section {
                padding: 15px 25px 25px;
                font-size: 14px;
            }
        }
        
.validation {
    position: fixed;
    bottom: 10px;
    right: 10px;
    background-color: #ffffff;
    padding: 8px 12px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    font-size: 12px;
}

.validation a {
    color: #b51f24;
    text-decoration: none;
    margin: 0 5px;
}

.validation a:hover {
    text-decoration: underline;
}

    </style>
</head>

<body>

    <main class="business-card">

        <section class="top-section">
            <h1 class="name">GEDEON NDJIBU</h1>

            <p class="title">CEO</p>

            <p class="email">
                <a href="mailto:gedeon.joachim@gmail.com">
                    gedeon.joachim@gmail.com
                </a>
            </p>
        </section>

        <div class="restaurant-name">
            Mongoose Restaurant
        </div>

        <div class="tagline">
            Come enjoy your plate with us.
        </div>

        <section class="bottom-section">

            <div class="address">
                4827 University Pointe Blvd.<br>
                Charlotte, NC 28262
            </div>

            <div class="contact">
                <a href="tel:+17045550186">
                    (704) 555-0186
                </a>
                <br>

                <a href="https://www.mongooserestaurant.com">
                    mongooserestaurant.com
                </a>
            </div>

        </section>

    </main>
    <div class="validation">
    <a href="https://validator.w3.org/check?uri=referer">
        HTML Validation
    </a>

    <a href="https://jigsaw.w3.org/css-validator/check/referer">
        CSS Validation
    </a>
</div>

</body>

</html>
